version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    environment:
      DEBUG: "true"
      SECURITY_SALT: "change-this-in-real-project"
      XDEBUG_MODE: "off"
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: cake
      DB_PASSWORD: cake
      DB_DATABASE: cakephp_app
      DB_TEST_DATABASE: cakephp_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cakephp_app
      MYSQL_USER: cake
      MYSQL_PASSWORD: cake
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucake", "-pcake"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
