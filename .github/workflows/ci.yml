name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cakephp_app
          MYSQL_USER: cake
          MYSQL_PASSWORD: cake
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Prepare test database
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS cakephp_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON cakephp_test.* TO 'cake'@'%';
          "

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Coding standards
        run: composer cs-check

      - name: Static analysis
        run: composer stan

      - name: Migrate app/test databases
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: cake
          DB_PASSWORD: cake
          DB_DATABASE: cakephp_app
          DB_TEST_DATABASE: cakephp_test
        run: |
          composer migrate
          composer migrate:test

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: cake
          DB_PASSWORD: cake
          DB_DATABASE: cakephp_app
          DB_TEST_DATABASE: cakephp_test
        run: composer test
